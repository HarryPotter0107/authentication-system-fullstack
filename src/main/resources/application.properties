spring.application.name=AuthenticationSystem
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=your db url
spring.datasource.username=your user name
spring.datasource.password=your password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT Configuration
jwt.secret=generate your token
jwt.expiration=3600000

# Countries where registration is not allowed
registration.blocked-countries=SY,AF,IR
registration.test-country-override-enabled=${REGISTRATION_TEST_COUNTRY_OVERRIDE:false}



app.admin.username=systemadmin
app.admin.email=admin@example.com
app.admin.password=write your password
